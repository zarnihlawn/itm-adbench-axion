# Beat-Paper dual_lift ceiling on RTX 3090 (24 GB VRAM / 16 CPU / 64 GiB RAM).
# Recipe fields match gpu_beat_paper.yaml; throughput only differs.
# Launch: CFG=configs/gpu_beat_paper_3090.yaml bash scripts/run_seeds.sh

seed: 111
seeds: [111, 222, 333, 444, 555]
run_id: axion_beat_paper_dual_lift_gpu

paths:
  adbench_root: data/adbench/datasets
  results_dir: results
  atlas_csv: data/atlas_57_beat_paper.csv
  embeds_alt_root: data/embeds_alt
  embeds_alt_whitened_root: data/embeds_alt_whitened

protocol:
  normalize: zscore
  unsupervised: full_dataset_train_and_score
  semi_supervised: train_50pct_normals_only
  metrics: [PR-AUC, ROC-AUC]
  embeddings:
    cv: CV_by_ViT
    nlp: NLP_by_RoBERTa

integrity:
  val_fraction: 0.2
  early_stop_metric: val_loss

harness:
  model: axion
  max_train_samples: 50000
  max_variants: 0

beat_paper:
  val_fraction: 0.2
  cv_folder: CV_by_ViT
  nlp_roberta_folder: NLP_by_RoBERTa
  nlp_bert_folder: NLP_by_BERT
  nlp_e5_folder: NLP_by_E5_large/pool=mean
  axion_config: gpu_beat_paper_3090.yaml

axion:
  epochs: 100
  batch_size: 512
  lr: 0.001
  weight_decay: 1.0e-05
  patience: 20
  val_fraction: 0.15
  latch_alpha: 0.4
  profile_router: false
  research_embeds: true
  ecod: false
  copod: false
  goad: false

  # Throughput: RTX 3090 24 GB / i5-13400 16 threads / 64 GiB RAM
  # Recipe-safe clamps (tiny/mid/huge) unchanged from gpu_final ship path.
  score_batch_size: 32768
  score_batch_size_oom_fallback: 2048
  dataloader_num_workers: 4
  tiny_n_safe_hw: true
  tiny_n_safe_threshold: 250
  tiny_n_score_batch_size: 512
  tiny_n_dataloader_num_workers: 0
  mid_n_safe_hw: true
  mid_n_score_batch_size: 512
  mid_n_dataloader_num_workers: 0
  huge_n_safe_hw: true
  huge_n_safe_threshold: 10000
  huge_n_score_batch_size: 512
  huge_n_dataloader_num_workers: 0
  mcs_pack_masks: false
  vectorized_masks: false
