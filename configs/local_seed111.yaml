# NOT the claim path. Throttled CPU debug only (20k cap, short patience).
# Main seed-111: bash scripts/run_seed111.sh (configs/gpu_beat_paper.yaml).
# Machine target: ~16 threads / ~16GB RAM, no NVIDIA driver in PATH.

seed: 111
seeds: [111]
run_id: axion_beat_paper_dual_lift_local111

paths:
  adbench_root: ../ADBench/adbench/datasets
  results_dir: results
  atlas_csv: data/atlas_57_beat_paper.csv
  embeds_alt_root: data/embeds_alt
  embeds_alt_whitened_root: data/embeds_alt_whitened

protocol:
  normalize: zscore
  unsupervised: full_dataset_train_and_score
  semi_supervised: train_50pct_normals_only
  metrics: [PR-AUC, ROC-AUC]
  embeddings:
    cv: CV_by_ViT
    nlp: NLP_by_RoBERTa

integrity:
  val_fraction: 0.2
  early_stop_metric: val_loss

harness:
  model: axion
  # Cap train rows to keep peak RSS down on 16GB hosts (cover/fraud/census).
  max_train_samples: 20000
  max_variants: 0

beat_paper:
  val_fraction: 0.2
  cv_folder: CV_by_ViT
  nlp_roberta_folder: NLP_by_RoBERTa
  nlp_bert_folder: NLP_by_BERT
  nlp_e5_folder: NLP_by_E5_large/pool=mean
  axion_config: local_seed111.yaml

axion:
  epochs: 80
  batch_size: 128
  lr: 0.001
  weight_decay: 1.0e-05
  patience: 12
  val_fraction: 0.15
  latch_alpha: 0.4
  profile_router: false
  research_embeds: true
  ecod: false
  copod: false
  goad: false
  # Prefer fewer loader processes on laptop RAM.
  dataloader_num_workers: 0
  score_batch_size: 1024
